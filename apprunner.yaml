version: 1.0
runtime: nodejs22

build:
  commands:
    build:
      - echo "🧹 Cleaning old dist folder..."
      - rm -rf dist || true
      - echo "📦 Installing dependencies..."
      - npm install --include=dev
      - echo "🏗️ Building app..."
      - npm run build --verbose
      - echo "📁 Checking dist folder contents..."
      - ls -la dist || (echo "❌ dist folder not found!" && exit 1)

run:
  # --single ensures React Router always returns index.html for any route
  command: npx serve -s dist --single -l 8080
  network:
    port: 8080
