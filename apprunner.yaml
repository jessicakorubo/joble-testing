version: 1.0
runtime: nodejs22

build:
  commands:
    build:
      - npm install --include=dev
      # Try building, print more logs if it fails
      - npm run build --verbose || (echo "Build failed. Printing logs..." && ls -la && cat /var/log/* || true)

run:
  command: npx serve -s dist -l 8080
  network:
    port: 8080
